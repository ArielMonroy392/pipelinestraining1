# This is a basic workflow to help you get started with Actions

name: CI

permissions:
  contents: read # for checkout action
  packages: write # for pushing docker image to GHCR

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["docker-test"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: self-hosted
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: install dependencies
        run: dotnet restore

      # Runs a single command using the runners shell
      - name: build
        run: dotnet build 

  test: 
    # The type of runner that the job will run on
    runs-on: self-hosted
    needs: build
    steps: 
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: dotnet restore

              # Runs a single command using the runners shell
      - name: test
        run: dotnet test -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=reports/coverage

      - name: run code coverage validation
        run: |
          cd myApp.Tests
          & "${{ github.workspace }}/scripts/validate_coverage.ps1"

      - name: install jetbrains tool
        run: |
          cd myApp
          dotnet tool install JetBrains.ReSharper.GlobalTools --tool-path $env:DOTNET_TOOLS_PATH
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}

      - name: run code inspection
        run: |
          $jbPath = Join-Path $env:DOTNET_TOOLS_PATH "jb.exe"
          Write-Host "Using JetBrains tool at $jbPath"
          & $jbPath inspectcode ./TrainProject.sln -o=myApp/reports/report
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}
      - name: run code inspection validation
        run: |
          cd myApp
          & "${{ github.workspace }}/scripts/validate_report.ps1"
      - name: install report generator tool
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path $env:DOTNET_TOOLS_PATH
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}
            
      - name: run report generator
        run: |
          $reportGenPath = Join-Path $env:DOTNET_TOOLS_PATH "reportgenerator.exe"
          & $reportGenPath -reports:myApp.Tests\reports\coverage.cobertura.xml -targetdir:myApp.Tests\reports\coveragereport -reporttypes:Html
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}

  publish:
    # The type of runner that the job will run on
    runs-on: self-hosted
    needs: test
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it

      - name: publish
        run: |
          dotnet publish ./myApp/myApp.csproj -c Release -r linux-x64 --self-contained true -o ./publish
      
      - name: build docker image
        run: | 
          docker build -t myapp:latest .
        
      - name: Log in to GitHub Container Registry
        run: echo $env:GHCR_PAT | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        
      - name: Tag Docker image
        run: docker tag myapp:latest ghcr.io/${{ github.repository_owner }}/pipelinestraining1:latest
      
      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/pipelinestraining1:latest
        
    
