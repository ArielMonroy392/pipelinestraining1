# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["arielMonroy_p1_base", "arielMonroy_p1_dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: self-hosted
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: install dependencies
        run: dotnet restore

      # Runs a single command using the runners shell
      - name: build
        run: dotnet build 

  test: 
    # The type of runner that the job will run on
    runs-on: self-hosted
    needs: build
    steps: 
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: dotnet restore

              # Runs a single command using the runners shell
      - name: test
        run: dotnet test -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=reports/coverage

      - name: install jetbrains tool
        run: |
          cd myApp.Tests
          dotnet tool install JetBrains.ReSharper.GlobalTools --tool-path $env:DOTNET_TOOLS_PATH
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}

      - name: run code inspection
        run: |
          $jbPath = Join-Path $env:DOTNET_TOOLS_PATH "jb.exe"
          Write-Host "Using JetBrains tool at $jbPath"
          & $jbPath inspectcode ./TrainProject.sln -o=reports/report
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}
      - name: run code inspection validation
        run: ../scripts/validate_report.ps1
      
      - name: install report generator tool
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path $DOTNET_TOOLS_PATH
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}
      
      - name: run report generator
        run: |
          $reportGenPath = Join-Path $env:DOTNET_TOOLS_PATH "reportgenerator.exe"
          & $reportGenPath -reports:reports\coverage.cobertura.xml -targetdir:reports\coveragereport -reporttypes:Html
        env:
          DOTNET_TOOLS_PATH: ${{ secrets.DOTNET_TOOLS_PATH }}

  publish:
    # The type of runner that the job will run on
    runs-on: self-hosted
    needs: test
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: publish
        run: dotnet publish --configuration Release --output ./publish_output --self-contained true --runtime win-x64 --no-restore --no-build --version-suffix $(date +%Y%m%d%H%M%S)
      




    
